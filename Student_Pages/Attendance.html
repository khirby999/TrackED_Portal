<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackED - Attendance History</title>
    <link rel="icon" type="image/png" href="../images/TrackEd Logo 2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/attendance.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-left">
            <a href="Course.html" class="back-btn" title="Back to Course">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2>Attendance History</h2>
        </div>

        <div class="right-menu">
            <div class="account">
                <button class="account-btn" id="accountBtn">
                    <i class="fa-solid fa-user"></i>
                    Account
                    <i class="fa-solid fa-caret-down"></i>
                </button>

                <ul class="dropdown-menu" id="dropdownMenu">
                    <li><a href="../settings.html"><i class="fa-solid fa-gear"></i>Settings</a></li>
                    <li><a href="../index.html"><i class="fa-solid fa-right-from-bracket"></i>Log Out</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="attendance-page">
        <div class="attendance-table">
            <div class="table-header">
                <h2>Attendance History</h2>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceTableBody">
                        <!-- Loaded dynamically via JavaScript based on selected course -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <div class="left-side">
            <p>TrackED.
                <br>Track your academic progress with ease.
            </p>
            <p>&copy; 2026 TrackED. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Supabase CDN + Backend Adapter -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const activeCourse     = localStorage.getItem("tracked_student_selected_course") || "Programming Fundamentals";
            const currentStudentId = localStorage.getItem("tracked_student_id") || "2024-00123";
            const tableBody        = document.getElementById("attendanceTableBody");

            function formatDisplayDate(dateStr) {
                if (!dateStr) return "";
                try {
                    const parts = dateStr.split("-");
                    if (parts.length === 3) {
                        const dateObj = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                        return dateObj.toLocaleDateString("en-US", { month: "long", day: "2-digit", year: "numeric" });
                    }
                } catch (e) {}
                return dateStr;
            }

            // Read live teacher attendance records for this course
            const attendanceKey = `tracked_course_attendance_${activeCourse}`;
            let attendanceMap = {};
            const raw = localStorage.getItem(attendanceKey);
            if (raw) {
                try { attendanceMap = JSON.parse(raw) || {}; } catch(e) {}
            }

            const sid = currentStudentId.trim();
            const sidLower = sid.toLowerCase();
            let filteredRecords = [];

            // Sorted dates descending (most recent date first)
            const dates = Object.keys(attendanceMap).sort().reverse();
            dates.forEach(d => {
                const dayMap = attendanceMap[d] || {};
                // Match this student by ID
                const stStatus = dayMap[sid] || dayMap[sidLower];
                if (stStatus) {
                    const statusLower = stStatus.toLowerCase();
                    // Only show Late and Absent — Present records are not displayed
                    if (statusLower === "present") return;
                    const statusStr = stStatus.charAt(0).toUpperCase() + stStatus.slice(1).toLowerCase();
                    filteredRecords.push({
                        date: formatDisplayDate(d),
                        status: statusStr
                    });
                }
            });

            if (tableBody) {
                if (filteredRecords.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="2" style="text-align: center; color: #94a3b8; padding: 36px 20px; font-size: 14px;">
                                <i class="fa-solid fa-folder-open" style="font-size: 28px; display: block; margin-bottom: 10px; color: #cbd5e1;"></i>
                                There are no records yet.
                            </td>
                        </tr>
                    `;
                } else {
                    tableBody.innerHTML = filteredRecords.map(record => {
                        const sLower = record.status.toLowerCase();
                        const isLate = sLower === "late";
                        const isAbsent = sLower === "absent";
                        const badgeClass = isLate ? "late" : (isAbsent ? "absent" : "present");
                        const iconClass  = isLate ? "fa-clock" : (isAbsent ? "fa-circle-xmark" : "fa-circle-check");

                        return `
                            <tr>
                                <td>${record.date}</td>
                                <td><span class="status-badge ${badgeClass}"><i class="fa-solid ${iconClass}"></i> ${record.status}</span></td>
                            </tr>
                        `;
                    }).join("");
                }
            }

            // Account dropdown
            const accountBtn = document.getElementById("accountBtn");
            const dropdownMenu = document.getElementById("dropdownMenu");

            if (accountBtn && dropdownMenu) {
                accountBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle("show");
                });

                document.addEventListener("click", (event) => {
                    if (!accountBtn.contains(event.target) && !dropdownMenu.contains(event.target)) {
                        dropdownMenu.classList.remove("show");
                    }
                });
            }
        });
    </script>
</body>
</html>
